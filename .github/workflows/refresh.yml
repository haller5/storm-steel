name: Refresh from Sheet

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab too

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_yioC16bi7OqUWRSCzf51wMeMH5sG/siM5XBzzXJ"
